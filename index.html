<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健身助手">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.js?v=1787127730454on">
  <title>健身助手 · 五分化训练</title>
  <link rel="stylesheet" href="css/style.css?v=1787037200283-back-shoulders-v2">
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <h1>今日训练</h1>
      <div class="header-right">
        <button class="header-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </header>

    <!-- Content -->
    <main class="app-content" id="appContent"></main>

    <!-- Tab Bar -->
    <nav class="app-tabs">
      <button class="tab-btn active" data-tab="today">
        <span class="tab-icon">🏠</span>
        <span>今日</span>
      </button>
      <button class="tab-btn" data-tab="plan">
        <span class="tab-icon">📋</span>
        <span>计划</span>
      </button>
      <button class="tab-btn" data-tab="history">
        <span class="tab-icon">📅</span>
        <span>记录</span>
      </button>
      <button class="tab-btn" data-tab="diet">
        <span class="tab-icon">🥗</span>
        <span>饮食</span>
      </button>
      <button class="tab-btn" data-tab="progress">
        <span class="tab-icon">📈</span>
        <span>身体</span>
      </button>
    </nav>
  </div>

  <script src="js/data.js?v=1787127730454-back-shoulders-v2"></script>
  <script src="js/app.js?v=1787127730454-back-shoulders-v2"></script>
</body>
</html>
