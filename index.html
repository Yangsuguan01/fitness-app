<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健身助手">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>健身助手 · 五分化训练</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body><div id="__err" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:red;color:white;padding:8px;font-size:12px;display:none;white-space:pre-wrap"></div>
<script>
window.onerror = function(m,s,l,c,e) {
  var d = document.getElementById('__err');
  if (d) { d.style.display='block'; d.textContent = m + ' [' + (s||'').split('/').pop() + ':' + l + ':' + c + '] ' + (e&&e.stack?e.stack.split('\n')[1]:''); }
};
</script>
  <div class="app-shell">
    <header class="app-header">
      <h1>今日训练</h1>
      <div class="header-right">
        <button class="header-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </header>
    <main class="app-content" id="appContent"></main>
    <nav class="app-tabs">
      <button class="tab-btn active" data-tab="today">
        <span class="tab-icon">🏠</span>
        <span>今日</span>
      </button>
      <button class="tab-btn" data-tab="plan">
        <span class="tab-icon">📋</span>
        <span>计划</span>
      </button>
      <button class="tab-btn" data-tab="history">
        <span class="tab-icon">📅</span>
        <span>记录</span>
      </button>
      <button class="tab-btn" data-tab="diet">
        <span class="tab-icon">🥗</span>
        <span>饮食</span>
      </button>
      <button class="tab-btn" data-tab="progress">
        <span class="tab-icon">📈</span>
        <span>身体</span>
      </button>
    </nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
