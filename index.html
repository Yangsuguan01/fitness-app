<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健身助手 Debug</title>
  <style>
    body { font-family: sans-serif; background: #0f0f1a; color: #fff; padding: 16px; }
    #debug { background: #1a1a2e; padding: 12px; border-radius: 8px; margin: 8px 0; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    .ok { color: #00d4aa; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <h2>🔍 Debug Mode</h2>
  <div id="debug">Loading...</div>
  <div id="content"></div>

  <script>
    var log = document.getElementById('debug');
    function addLog(msg, type) {
      var div = document.createElement('div');
      div.className = type || '';
      div.textContent = msg;
      log.appendChild(div);
    }

    window.onerror = function(msg, url, line, col, err) {
      addLog('❌ ERROR: ' + msg, 'err');
      addLog('   at ' + (url||'').split('/').pop() + ':' + line + ':' + col, 'err');
      if (err && err.stack) addLog('   ' + err.stack.split('\n').slice(0,3).join('\n'), 'err');
      return false;
    };

    addLog('1. Loading data.js...');
  </script>

  <script src="js/data.js"></script>

  <script>
    addLog('2. data.js loaded');
    addLog('   WORKOUT_PLAN: ' + (typeof WORKOUT_PLAN !== 'undefined' ? 'OK (' + Object.keys(WORKOUT_PLAN).length + ' days)' : 'MISSING!'), typeof WORKOUT_PLAN !== 'undefined' ? 'ok' : 'err');
    addLog('   DAY_NAMES_CN: ' + (typeof DAY_NAMES_CN !== 'undefined' ? 'OK' : 'MISSING!'), typeof DAY_NAMES_CN !== 'undefined' ? 'ok' : 'err');
    addLog('   Storage: ' + (typeof Storage !== 'undefined' ? 'OK' : 'MISSING!'), typeof Storage !== 'undefined' ? 'ok' : 'err');
    addLog('   getTodayKey: ' + (typeof getTodayKey !== 'undefined' ? 'OK' : 'MISSING!'), typeof getTodayKey !== 'undefined' ? 'ok' : 'err');
    addLog('3. Loading app.js...');
  </script>

  <script src="js/app.js"></script>

  <script>
    addLog('4. app.js loaded');
    addLog('   state: ' + (typeof state !== 'undefined' ? 'OK' : 'MISSING!'), typeof state !== 'undefined' ? 'ok' : 'err');
    addLog('   renderToday: ' + (typeof renderToday !== 'undefined' ? 'OK' : 'MISSING!'), typeof renderToday !== 'undefined' ? 'ok' : 'err');
    addLog('   initApp: ' + (typeof initApp !== 'undefined' ? 'OK' : 'MISSING!'), typeof initApp !== 'undefined' ? 'ok' : 'err');
    if (typeof state !== 'undefined') {
      addLog('   state.workoutKey: ' + state.workoutKey);
      addLog('   state.todayKey: ' + state.todayKey);
    }
    addLog('5. Done! Check for errors above.', 'ok');
  </script>
</body>
</html>
